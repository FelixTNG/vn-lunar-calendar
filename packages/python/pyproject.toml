[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "vn-lunar"
version = "0.1.0"
description = "Vietnamese Lunar Calendar - Python bindings"
readme = "../../README.md"
license = {text = "MIT"}
authors = [{name = "Felix", email = "felix.tunguyen@gmail.com"}]
keywords = ["lunar", "calendar", "vietnam", "am-lich", "lich-am"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-benchmark"]

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py313"]
compatibility = "off"
manylinux = "manylinux_2_28"
skip-auditwheel = false
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = ["tests"]