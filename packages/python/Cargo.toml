[package]
name = "vn-lunar-python"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Python bindings for vn-lunar-core"
authors = { workspace = true }
categories = ["date-and-time", "external-ffi-bindings"]
keywords = ["lunar", "calendar", "vietnam", "am-lich", "lich-am"]
readme = "../../README.md"

[lib]
name = "vn_lunar"
crate-type = ["cdylib"]

[dependencies]
vn-lunar-core = { path = "../../crates/vn-lunar-core", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"] }
