[package]
name = "vn-lunar-js"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/FelixTNG/vn-lunar-calendar"
description = "JavaScript/TypeScript bindings for vn-lunar-core via WebAssembly"
authors = ["Felix <felix.tunguyen@gmail.com>"]
categories = ["wasm", "date-and-time"]
keywords = ["lunar", "calendar", "vietnam", "am-lich", "wasm"]
readme = "../../README.md"

[lib]
name = "vn_lunar_js"
crate-type = ["cdylib"]

[dependencies]
vn-lunar-core = { path = "../../crates/vn-lunar-core", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
