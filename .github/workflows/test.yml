name: CI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy -p vn-lunar-core --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test -p vn-lunar-core --all-features

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install maturin
        run: pip install maturin
      - name: Build Python package
        run: |
          cd packages/python
          maturin develop --release
      - name: Run Python tests
        run: |
          cd packages/python
          pip install pytest pytest-benchmark
          python -c "from vn_lunar import LunarCalendar; cal = LunarCalendar(); lunar = cal.solar_to_lunar(2025, 1, 29); print(lunar.vietnamese_name()); assert lunar.is_tet()"

  js-test:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: packages/js/package.json
      - name: Install and test
        run: |
          cd packages/js
          npm install
          npm test
          npm run build

  cross-platform-test:
    name: Cross-platform (macOS, Windows)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run core tests
        run: cargo test --package vn-lunar-core --all-features