name: Test & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============ TEST ============
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.97.1"]
        include:
          - os: ubuntu-latest
            python: "3.15"
          - os: macos-latest
            python: "3.15"
          - os: windows-latest
            python: "3.15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Test Rust core
        run: cargo test -p vn-lunar-core

      - name: Install Python 3.15
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test Python bindings (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install maturin pytest
          cd packages/python
          maturin develop --release
          python -c "
          from vn_lunar import LunarCalendar
          cal = LunarCalendar()
          lunar = cal.solar_to_lunar(2025, 1, 29)
          print(f'Tết 2025: {lunar.vietnamese_name()}')
          assert lunar.is_tet()
          print('✅ Python bindings work!')
          "

      - name: Install Node.js 26
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Test WASM bindings (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          cd packages/js
          wasm-pack build --target nodejs --out-dir pkg
          # Quick test with Node
          node -e "
          const { LunarCalendar } = require('./pkg');
          const cal = new LunarCalendar();
          const lunar = cal.solarToLunar(2025, 1, 29);
          console.log('Tết 2025:', lunar.vietnameseName());
          console.log('Is Tết:', lunar.isTet());
          console.log('✅ WASM bindings work!');
          "

  # ============ PUBLISH ============
  publish:
    name: Publish Packages
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Publish Rust crate (crates.io)
        run: cargo publish --package vn-lunar-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish Python package (PyPI)
        run: |
          pip install maturin
          cd packages/python
          maturin publish --cargo-extra-args="--package vn-lunar-python" --username __token__ --password ${{ secrets.PYPI_TOKEN }}
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Publish JavaScript package (npm)
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          cd packages/js
          wasm-pack build --target bundler --out-dir pkg --release
          cd pkg
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            packages/js/pkg/*.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}