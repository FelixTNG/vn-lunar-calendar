name: Publish Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish-rust:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish core crate
        run: cargo publish --package vn-lunar-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-python:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install maturin
        run: pip install maturin
      - name: Build and publish Python package
        run: |
          cd packages/python
          maturin publish --registry pypi --username __token__ --password ${{ secrets.PYPI_TOKEN }}
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-js:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build WASM package
        run: |
          cd packages/js
          wasm-pack build --target bundler --out-dir pkg --release
      - name: Prepare npm package
        run: |
          cd packages/js
          # Copy package.json to pkg directory
          cp package.json pkg/
          # Update version from Cargo.toml
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          cd pkg
          npm version $VERSION --no-git-tag-version
      - name: Publish to npm
        run: |
          cd packages/js/pkg
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: [publish-rust, publish-python, publish-js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            packages/python/dist/*.whl
            packages/js/pkg/*.tgz